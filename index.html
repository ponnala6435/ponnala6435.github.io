<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simone Percossi · Portfolio</title>
  <meta name="description" content="Simone Percossi, Technical Program Manager: progetti, percorso e laurea in Ingegneria Informatica e AI.">
  <meta name="theme-color" content="#0b0c18">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=202610102012">
</head>
<body>
  <a class="skip" href="#main" data-t="skip"></a>

  <header class="bar">
    <div class="wrap bar__inner">
      <span class="bar__name">Simone Percossi</span>
      <nav class="bar__nav" aria-label="Sezioni" data-t-aria="navLabel">
        <a href="#progetti" data-t="navProjects"></a>
        <a href="#laurea" data-t="navDegree"></a>
        <a href="#contatti" data-t="navContact"></a>
      </nav>
      <div class="lang" role="group" aria-label="Lingua" data-t-aria="langLabel">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap">
      <div class="hero__text">
        <p class="hero__kicker" data-t="kicker"></p>
        <h1 class="hero__name">Simone Percossi</h1>
        <p class="hero__role" id="ruolo"></p>
        <p class="hero__intro" id="presentazione"></p>
        <p class="links" id="link-hero"></p>
      </div>

      <aside class="card-player" aria-labelledby="scheda-titolo">
        <h2 class="card-player__title" id="scheda-titolo" data-t="cardTitle"></h2>
        <dl class="card-player__stats" id="scheda"></dl>
        <div class="xp">
          <div class="xp__head"><span data-t="xpLabel"></span><span id="xp-valore"></span></div>
          <div class="xp__bar"><span id="xp-riempimento"></span></div>
        </div>
      </aside>
    </section>

    <section class="wrap section section--tight" aria-labelledby="percorso-titolo">
      <h2 id="percorso-titolo" data-t="routeTitle"></h2>
      <ol class="route" id="percorso"></ol>
    </section>

    <section class="wrap section" aria-labelledby="forza-titolo">
      <h2 id="forza-titolo" data-t="strengthsTitle"></h2>
      <div class="strengths" id="punti-forza"></div>
    </section>

    <section class="wrap section" id="progetti" aria-labelledby="progetto-titolo">
      <div class="glass-zone">
      <span class="blob blob--a" aria-hidden="true"></span>
      <span class="blob blob--b" aria-hidden="true"></span>
      <span class="blob blob--c" aria-hidden="true"></span>
      <div class="glass">
      <p class="eyebrow" data-t="featured"></p>
      <h2 id="progetto-titolo"></h2>
      <p class="lead" id="progetto-intro"></p>

      <details class="more">
      <summary class="more__toggle"><span data-t="pipelineTitle"></span><span class="more__hint" data-t="expandHint"></span></summary>
      <div class="more__body">
      <ol class="pipeline" id="pipeline"></ol>

      <h3 data-t="resultsTitle"></h3>
      <div class="compare" id="risultati"></div>
      <p class="note" id="dataset"></p>

      <div class="split">
        <div class="panel">
          <h3 data-t="errorsTitle"></h3>
          <ul class="plain-list" id="errori"></ul>
        </div>
        <div class="panel">
          <h3 data-t="whyTitle"></h3>
          <p id="perche"></p>
        </div>
      </div>

      <p class="links links--code" id="progetto-link"></p>
      </div>
      </details>
      </div>
      </div>

      <h3 data-t="otherProjects"></h3>
      <div class="terminal">
        <div class="terminal__bar" aria-hidden="true">
          <span class="terminal__dots"><i></i><i></i><i></i></span>
          <span class="terminal__title">simone@portfolio: ~/altri-progetti</span>
        </div>
        <div class="terminal__body">
          <p class="terminal__line" aria-hidden="true"><span class="t-user">simone@portfolio</span>:<span class="t-path">~/altri-progetti</span>$ ls</p>
          <div id="altri-progetti"></div>
          <p class="terminal__line" aria-hidden="true"><span class="t-user">simone@portfolio</span>:<span class="t-path">~/altri-progetti</span>$ <span class="t-cursor"></span></p>
        </div>
      </div>
    </section>

    <section class="wrap section" id="laurea" aria-labelledby="laurea-titolo">
      <div class="glass-zone glass-zone--degree">
      <span class="blob blob--a" aria-hidden="true"></span>
      <span class="blob blob--b" aria-hidden="true"></span>
      <span class="blob blob--c" aria-hidden="true"></span>
      <div class="glass">
      <h2 id="laurea-titolo" data-t="degreeTitle"></h2>
      <p class="lead" id="laurea-nome"></p>

      <div class="credits panel">
        <p class="credits__summary" id="crediti-sintesi"></p>
        <div class="fiber" id="fibra" role="img"></div>
        <ul class="legend" id="legenda"></ul>
      </div>

      <h3 data-t="doneTitle"></h3>
      <div class="areas" id="aree"></div>

      <h3 data-t="nextTitle"></h3>
      <ul class="courses courses--next" id="da-sostenere"></ul>
      </div>
      </div>
    </section>
  </main>

  <footer class="wrap footer" id="contatti">
    <h2 data-t="contactTitle"></h2>
    <p class="links" id="link-footer"></p>
    <p class="note" id="aggiornato"></p>
  </footer>

  <script src="data.js?v=202610102012"></script>
  <script src="app.js?v=202610102012"></script>
</body>
</html>
